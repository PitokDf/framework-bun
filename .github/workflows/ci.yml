name: CI Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: packages/buntok-core
      - run: bun run typecheck
        working-directory: packages/buntok-core

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: packages/buntok-core
      - run: bun run test:unit
        working-directory: packages/buntok-core

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: packages/buntok-core
      - run: bun run test:integration
        working-directory: packages/buntok-core

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: packages/buntok-core
      - run: bun run build
        working-directory: packages/buntok-core
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/buntok-core/dist/
          retention-days: 1

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/buntok-core/dist/
      - run: bun install
        working-directory: packages/buntok-core
      - name: Validate ESM import
        run: |
          echo 'import { App } from "@buntok/core"; console.log(typeof App);' > /tmp/test-esm.ts
          cd /tmp && bun init -y && bun add ../../../packages/buntok-core && bun run test-esm.ts
      - name: Validate CJS require
        run: |
          echo 'const { App } = require("@buntok/core"); console.log(typeof App);' > /tmp/test-cjs.cjs
          cd /tmp && node test-cjs.cjs
      - name: Validate CLI entry
        run: node packages/buntok-core/dist/cli/index.js --help || true

  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: packages/buntok-core
      - run: bun run build
        working-directory: packages/buntok-core
      - run: bun run scripts/check-docs-contract.ts
        working-directory: packages/buntok-core
